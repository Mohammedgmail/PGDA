# Example configuration for PGDA Task 2: Sliding with conflicting material-specific pushes
# Reference only: no script reads this file. Each script's settings are the
# constants at the top of the file (see README).
# This task requires different push strategies for different materials

environment:
  task: "sliding"  # Uses pushing_env_task2.py
  randomization_mode: "experimental"
  max_episode_steps: 200
  success_threshold: 0.05

materials:
  Heavy_Rust:
    mass_range: [2.0, 3.0]
    lateral_friction_range: [0.8, 1.0]
    required_push: "high_force"  # Needs firm push
  
  Wet_Ice:
    mass_range: [0.5, 1.5]
    lateral_friction_range: [0.01, 0.05]
    required_push: "gentle"  # Needs gentle strike
  
  Coarse_Sandpaper:
    mass_range: [1.0, 2.0]
    lateral_friction_range: [1.0, 1.5]
    required_push: "moderate"

# The key insight from the paper: first contact reveals material within one control step
# Scripted policies that react to contact recover most of the cue's value

evaluation:
  policy_types:
    - "reactive"    # Can react after first contact (5.1 pp gain from perfect cue)
    - "committed"   # Must commit before contact (11.8 pp gain from perfect cue)
  num_episodes: 840
